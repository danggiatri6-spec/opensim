name: OpenSim-next build

on:
  push:
    branches:
      - opensim-next-dev
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus libc6-dev

      - name: Generate solution and project files
        run: |
          chmod +x ./runprebuild.sh
          ./runprebuild.sh

      - name: Build OpenSim
        run: dotnet build --configuration Release OpenSim.sln

      - name: Run AI Friend domain tests
        run: dotnet run --configuration Release --project tools/ai-friend-test-runner/AiFriend.TestRunner.csproj

      - name: Run AI Friend SQLite integration tests
        run: dotnet run --configuration Release --project tools/ai-friend-sqlite-test-runner/AiFriendSqliteTestRunner.csproj

      - name: Run Game Platform validation and SQLite integration tests
        run: dotnet run --configuration Release --project tools/game-project-test-runner/GameProjectTestRunner.csproj

      - name: Run Game Physics Worker protocol tests
        run: dotnet run --configuration Release --project tools/game-physics-worker-protocol/tests/GamePhysicsWorker.Protocol.Tests.csproj

      - name: Run Game Physics Worker process integration tests
        run: dotnet run --configuration Release --project tools/game-physics-worker/tests/GamePhysicsWorker.Integration.Tests.csproj

      - name: Run Game Physics Worker supervisor tests
        run: dotnet run --configuration Release --project tools/game-physics-worker-supervisor/tests/GamePhysicsWorker.Supervisor.Tests.csproj

      - name: Verify UDP test assembly was compiled
        run: |
          test -f bin/OpenSim.Region.ClientStack.LindenUDP.Tests.dll
          ls -lh bin/OpenSim.Region.ClientStack.LindenUDP.Tests.dll

      - name: Run focused UDP packet handler tests
        run: dotnet run --configuration Release --project tools/udp-test-runner/UdpTestRunner.csproj

      - name: Upload UDP test assembly
        uses: actions/upload-artifact@v4
        with:
          name: opensim-next-udp-tests
          path: bin/OpenSim.Region.ClientStack.LindenUDP.Tests.dll
          if-no-files-found: error

  worker-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Windows Named Pipes supervisor tests
        run: dotnet run --configuration Release --project tools/game-physics-worker-supervisor/tests/GamePhysicsWorker.Supervisor.Tests.csproj
